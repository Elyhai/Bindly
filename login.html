<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="icon" type="images/png" href="assets/icons/bindly-icon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="flex-container"> <!-- left side should be the login form and the right side should be a video container or panel (vertically centered both). Use flexbox for this. -->
        <div class="login-container">
            <span class="icon-text"> <!--This is where the Bindly icon and text goes. -->
                    <img class="bindly-icon" src="assets/icons/bindly-icon.png" aria-hidden="true"></img> <!--This is where the Bindly icon goes. Kung img nmn yung icon, gawin mo tong img tag -->
                    <span>Bindly</span> <!-- ED Garamond font. This is where the Bindly text goes. -->
            </span>
                <h2>A notebook that lives in your browser</h2> <!-- ED Garamond font -->
            <form class="login-form" action="index.html" onsubmit="localStorage.bindly_user=username.value; location='index.html'; return false">
                <p class="sub">Please enter your credentials.</p> <!-- Open sans font and css: .login-container p.sub -->
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="4" autocomplete="current-password">
                <button class="btn" type="submit">Login</button> <!-- css: .login-container .btn -->
            </form>
        </div>
        <div class="visual-panel"> <!-- this video container or panel should be portrait and should be on the right side of the login form. -->
            <video autoplay muted loop>
                <source src="assets/videos/background.mp4" type="video/mp4"> 
            </video>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Bindly. All rights reserved by Calilan and Rincoraya.</p>
    </footer>
    <script>
        localStorage.removeItem('bindly_user')
    </script>
</body>
</html>
